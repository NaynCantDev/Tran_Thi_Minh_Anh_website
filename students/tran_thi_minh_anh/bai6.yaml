# ============================================================
#  Bài 6.4 – Sử dụng AI có trách nhiệm trong học tập và nghiên cứu
#  Bộ nguyên tắc cá nhân, dựng từ chính các lỗi AI mình gặp ở Bài 2, 3, 5
# ============================================================
kind: charter
intro: 'Yêu cầu: xây dựng bộ nguyên tắc cá nhân về sử dụng AI có trách nhiệm, dựa trên nghiên cứu. Mình không chép lại nguyên tắc chung chung, mà đi từ những lần chính mình bị AI “đánh lừa” trong các bài trước.'

# 1. Nhật ký sự cố: bằng chứng của chính mình
incidents:
  - from: Bài 3
    link: project-3.html
    what: 'Gemini tóm tắt một bài báo mà không cho biết mình chưa đọc được bài, còn bịa thêm một mục mà bài gốc không có. Ở đề trắc nghiệm nhạc lý, phần “tự giải lại” vẫn kết luận không có sai sót, trong khi 2/8 câu sai.'
    risk: Ảo giác (hallucination) và tự kiểm tra không đáng tin
  - from: Bài 5
    link: project-5.html
    what: Gemini gọi cảm giác rung ở má là “vibrato tự nhiên”. Khi bị chỉ ra, AI nhận lỗi nhưng lại thêm một khẳng định mới chưa có nguồn, và đưa ra cụm “Mê mha” không phải tiếng Việt.
    risk: Sai kiến thức chuyên ngành và sai ngôn ngữ, khó nhận ra nếu không học chuyên ngành
  - from: Bài 2
    link: project-2.html
    what: 'Google Scholar chặn truy vấn tự động. Toán tử intitle: kéo theo toàn quảng cáo “AI Music Generator”, và có cả bài “top 10 phần mềm AI” được trình bày như nguồn tham khảo.'
    risk: Nguồn kém chất lượng và quy định của nền tảng

# 2. Cơ sở: những gì mình đã đọc
basis:
  - k: Luật
    head: 'Luật Trí tuệ nhân tạo số 134/2025/QH15'
    body: 'Quốc hội thông qua ngày 10/12/2025, có hiệu lực từ 01/3/2026. Đây là đạo luật riêng đầu tiên của Việt Nam về AI, đặt con người ở trung tâm: AI phục vụ, không thay thế con người, và con người giữ quyền giám sát. Luật cũng đề cập đến nội dung do AI tạo ra.'
  - k: Luật
    head: 'Luật Bảo vệ dữ liệu cá nhân số 91/2025/QH15 và Nghị định 356/2025/NĐ-CP'
    body: 'Có hiệu lực từ 01/01/2026, nghiêm cấm mua bán dữ liệu cá nhân và đặc biệt chú trọng bảo vệ dữ liệu trẻ em. Với một giáo viên tương lai, điều này có nghĩa là không được đưa ảnh, giọng hát hay thông tin của học sinh lên công cụ AI.'
  - k: Luật
    head: Luật Sở hữu trí tuệ
    body: Bản nhạc, lời bài hát và bài báo đều có chủ sở hữu. Dùng AI để “viết lại” một tác phẩm vẫn có thể là sử dụng tác phẩm của người khác.
  - k: Quốc tế
    head: UNESCO (2023) – Hướng dẫn về AI tạo sinh trong giáo dục và nghiên cứu
    body: Khuyến nghị cách tiếp cận lấy con người làm trung tâm, kiểm chứng đầu ra của AI và đặt giới hạn độ tuổi khi học sinh tự dùng công cụ AI tạo sinh. Học sinh tiểu học vì vậy không nên tự trò chuyện với chatbot trong giờ học.
  - k: Trích dẫn
    head: APA Style – cách trích dẫn công cụ AI tạo sinh
    body: Khi dùng nội dung do AI tạo ra, cần ghi tên công cụ, nhà phát triển, phiên bản, ngày dùng, và mô tả prompt trong phần phương pháp.
  - k: Liêm chính
    head: Quy định của đề thi học phần INF2501
    body: Bài tập phải khai báo rõ việc dùng AI. Riêng phần cảm nhận và tự đánh giá thì sinh viên phải tự viết.

# 3. Bộ nguyên tắc: 4 thời điểm của một lần dùng AI, như một buổi biểu diễn
charter:
  - when: Trước khi hỏi
    mark: Chuẩn bị
    rules:
      - head: Tự nghĩ trước, rồi mới hỏi
        body: Mình viết ra điều mình đã biết và điều mình cần trước khi mở AI. Nếu chưa nghĩ gì mà hỏi ngay thì mình sẽ không có gì để đối chiếu với câu trả lời.
        why: 'Bài 5: nhờ đã học Thanh nhạc nên mình mới nhận ra lỗi “vibrato”.'
      - head: Không đưa dữ liệu của người khác vào AI
        body: Không tải lên ảnh, giọng hát, họ tên hay điểm số của học sinh và bạn bè, kể cả để “nhờ nhận xét”. Ví dụ phải đặt tên giả và bỏ chi tiết nhận dạng.
        why: Luật Bảo vệ dữ liệu cá nhân 2025, đặc biệt là dữ liệu trẻ em.
  - when: Trong khi dùng
    mark: Biểu diễn
    rules:
      - head: Yêu cầu AI nói rõ điều chưa chắc
        body: Prompt nào cũng có câu “Nếu không chắc hoặc không đọc được tài liệu thì nói rõ”. Mình hỏi theo từng phần nhỏ để dễ kiểm tra.
        why: 'Bài 3 và Bài 5: Gemini có tự ghi “chưa chắc” ở trò chơi 3 khi được yêu cầu.'
      - head: Tôn trọng quy định của nền tảng
        body: Không lách CAPTCHA, không dùng công cụ để vượt chặn. Khi một công cụ không cho phép, mình đổi sang công cụ hoặc cách làm khác.
        why: 'Bài 2: Google Scholar chặn truy vấn tự động.'
  - when: Sau khi nhận
    mark: Tập lại
    rules:
      - head: Kiểm tra mọi khẳng định chuyên môn bằng nguồn gốc
        body: Mỗi thông tin về giọng hát, nhạc lý hay số liệu đều phải có một nguồn mình đã tự đọc (giáo trình, bài báo có bình duyệt). Không tìm được nguồn thì bỏ, kể cả khi nghe rất hay.
        why: 'Bài 5: mình bỏ câu “thanh đới trẻ chưa đủ để tạo vibrato” vì không kiểm chứng được.'
      - head: Câu trả lời đã sửa cũng phải kiểm tra lại
        body: AI sửa lỗi rất nhanh nhưng có thể thêm lỗi mới. Mình không tin việc AI “tự kiểm tra”.
        why: 'Bài 3 (tự giải lại vẫn sai) và Bài 5 (lượt 2 thêm “Mê mha”).'
  - when: Khi công bố
    mark: Ra mắt
    rules:
      - head: Khai báo AI đã làm gì, mình đã làm gì
        body: Mỗi bài trên portfolio này đều có mục “Sử dụng AI”, ghi rõ công cụ, ngày dùng, mục đích, và phần nào là của mình. Khi trích dẫn thì làm theo hướng dẫn APA cho công cụ AI.
        why: Quy định của học phần INF2501 và APA Style.
      - head: Phần cảm nhận và giọng nói riêng là của mình
        body: Không để AI viết cảm nhận, tự đánh giá hay lời bài hát thay mình. Với học sinh, những lời các em sẽ đọc và hát phải do giáo viên tự viết và chịu trách nhiệm.
        why: 'Bài 5: mình tự viết câu vè và các dòng luyện phát âm.'
      - head: Trong lớp tiểu học, giáo viên dùng AI, không phải học sinh
        body: Mình dùng AI để chuẩn bị bài ở nhà. Học sinh lớp 3 được học bằng học liệu đã kiểm duyệt, không tự trò chuyện với chatbot.
        why: Khuyến nghị về độ tuổi của UNESCO (2023).

# Bảng tự kiểm tra trước khi nộp (tương tác)
checklist:
  - Mình đã tự làm hoặc tự nghĩ trước khi hỏi AI
  - Không có dữ liệu cá nhân của ai khác trong prompt
  - Mọi khẳng định chuyên môn đều có nguồn mình đã đọc
  - Đã kiểm tra lại cả câu trả lời sau khi AI sửa
  - Đã ghi rõ công cụ, ngày dùng và phần việc của AI
  - Phần cảm nhận, tự đánh giá do mình tự viết

