    title: Hiểu nền tảng
    text: Kiến thức cơ bản về công nghệ số và trí tuệ nhân tạo; vai trò, tầm quan trọng và khả năng ứng dụng của công nghệ trong học tập, nghiên cứu và đời sống.
  - dyn: mp
    term: mezzo piano · vừa nhẹ
    title: Dùng thạo công cụ AI
    text: Kỹ năng sử dụng ChatGPT, Gemini, Copilot để tìm kiếm, xử lý thông tin, sáng tạo nội dung và giải quyết các nhiệm vụ học tập.
  - dyn: mf
    term: mezzo forte · vừa mạnh
