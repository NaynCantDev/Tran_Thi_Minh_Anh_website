    text: Rèn tư duy sáng tạo, khả năng phân tích, đánh giá thông tin và ý thức dùng công nghệ an toàn, hiệu quả, có trách nhiệm.
  - dyn: f
    term: forte · mạnh
    title: Mang vào lớp học nhạc
    text: Vận dụng công nghệ số và AI vào chuyên ngành Sư phạm Âm nhạc — xây dựng giáo án, thiết kế bài giảng, nâng cao chất lượng dạy học, đáp ứng yêu cầu đổi mới giáo dục.

# ---------- Định hướng phát triển ----------
direction: >-
  Trong quá trình học tập môn Nhập môn Công nghệ số và Ứng dụng AI, em định hướng phát triển bản thân theo hướng
  chủ động tiếp cận, học hỏi và làm chủ các công nghệ hiện đại. Không ngừng trau dồi kiến thức, nâng cao kỹ năng sử
  dụng các công cụ AI để hỗ trợ học tập, nghiên cứu và phát triển khả năng sáng tạo. Bên cạnh đó, em sẽ rèn luyện tư
  duy phản biện, kỹ năng tìm kiếm, chọn lọc và đánh giá thông tin, tránh phụ thuộc hoàn toàn vào trí tuệ nhân tạo.
  Đặc biệt, với định hướng theo học ngành Sư phạm Âm nhạc, em mong muốn vận dụng công nghệ số và AI vào việc soạn
  giáo án, thiết kế bài giảng, xây dựng học liệu âm nhạc và tổ chức các hoạt động dạy học một cách sinh động, hiệu
  quả. Qua đó, từng bước hoàn thiện năng lực chuyên môn, kỹ năng nghề nghiệp và trở thành một giáo viên âm nhạc có
  khả năng thích ứng với sự phát triển của giáo dục trong thời đại số.
# Định hướng xếp theo cấu trúc một bài hát. "melody" = số nửa cung tính từ Đô (0 = Đô, 7 = Son, 12 = Đô cao) để web hát thử từng đoạn.
direction_song:
  - part: Intro
    title: Chủ động tiếp cận
    text: Chủ động tiếp cận, học hỏi và làm chủ các công nghệ hiện đại.
    melody: [0, 2, 4, 7]
  - part: Verse
    title: Trau dồi mỗi ngày
    text: Không ngừng trau dồi kiến thức, nâng cao kỹ năng dùng công cụ AI để hỗ trợ học tập, nghiên cứu và phát triển khả năng sáng tạo.
    melody: [4, 4, 5, 4, 2, 0]
  - part: Pre-chorus
    title: Giữ giọng của mình
    text: Rèn tư duy phản biện, kỹ năng tìm kiếm, chọn lọc và đánh giá thông tin — tránh phụ thuộc hoàn toàn vào trí tuệ nhân tạo.
    melody: [5, 7, 9, 7, 5, 4]
  - part: Chorus
    title: Lớp học nhạc sinh động
    text: Vận dụng công nghệ số và AI vào soạn giáo án, thiết kế bài giảng, xây dựng học liệu âm nhạc và tổ chức hoạt động dạy học sinh động, hiệu quả.
    melody: [7, 9, 11, 12, 11, 9, 7]
  - part: Outro
    title: Người giáo viên của thời đại số
    text: Từng bước hoàn thiện năng lực chuyên môn, kỹ năng nghề nghiệp và trở thành giáo viên âm nhạc thích ứng với giáo dục thời đại số.
    melody: [12, 7, 4, 0]

# ---------- Mục tiêu của Portfolio ----------
portfolio_goal: >-
  Portfolio được xây dựng nhằm tổng hợp, lưu trữ và giới thiệu những kiến thức, kỹ năng, sản phẩm học tập cũng như
  kết quả đạt được trong quá trình học tập môn Nhập môn Công nghệ số và Ứng dụng AI. Thông qua Portfolio, em có thể
  nhìn nhận và đánh giá sự tiến bộ của bản thân, xác định những điểm mạnh, hạn chế cần khắc phục và định hướng phát
  triển trong tương lai. Đồng thời, đây cũng là cơ hội để em thể hiện khả năng ứng dụng công nghệ số và trí tuệ nhân
  tạo vào học tập, nghiên cứu cũng như chuyên ngành Sư phạm Âm nhạc, từ đó nâng cao năng lực chuyên môn và kỹ năng
  nghề nghiệp, đáp ứng yêu cầu đổi mới giáo dục trong thời đại số.
portfolio_rows:
  - k: Tổng hợp
    v: Lưu trữ và giới thiệu kiến thức, kỹ năng, sản phẩm học tập, kết quả đạt được
  - k: Nhìn lại
    v: Đánh giá sự tiến bộ, điểm mạnh, hạn chế cần khắc phục
  - k: Thể hiện
    v: Ứng dụng công nghệ số và AI vào học tập, nghiên cứu, Sư phạm Âm nhạc
  - k: Hướng tới
    v: Nâng cao năng lực chuyên môn, kỹ năng nghề nghiệp trong thời đại số

# ---------- 6 bài tập (chưa điền — chờ Nayn gửi đề) ----------
projects:
  - id: 1
    section: '1.4'
    title: Thao tác cơ bản với tệp tin và thư mục
    chapter: Chương 1 – Máy tính và các thiết bị ngoại vi
    objective: 'Thực hành trên Windows các thao tác cơ bản với tệp và thư mục: truy cập thư mục, tạo thư mục và tệp văn bản, đổi tên, sao chép, di chuyển và xóa. Qua đó rèn thói quen tổ chức thư mục có cấu trúc và đặt tên tệp rõ ràng.'
    process:
      - 'Bước 1: Mở File Explorer, vào thư mục Documents.'
      - 'Bước 2: Trong Documents, tạo thư mục ThucHanh_TranThiMinhAnh.'
      - 'Bước 3: Tạo tệp GhiChu.txt rồi đổi tên thành GhiChuQuanTrong.txt.'
      - 'Bước 4: Tạo thư mục con TaiLieu, sao chép GhiChuQuanTrong.txt vào đó.'
      - 'Bước 5: Tạo tệp DiChuen.txt, cắt và dán vào TaiLieu.'
      - 'Bước 6: Xóa GhiChuQuanTrong.txt trong TaiLieu bằng Delete (tệp vào Thùng rác).'
      - 'Bước 7: Xóa DiChuen.txt, thư mục TaiLieu trở về trống.'
      - 'Khó khăn: Dễ nhầm giữa sao chép (Copy) và di chuyển (Cut). – Giải quyết bằng cách kiểm tra lại cả thư mục nguồn và thư mục đích sau mỗi thao tác: sao chép thì tệp còn ở cả hai nơi, di chuyển thì chỉ còn ở nơi mới.'
    tool: 'File Explorer (Windows 11), thực hành trong Windows Sandbox – môi trường Windows sạch'
    ai_use: 'Không sử dụng AI.'
    product_file: bai1.yaml
  - id: 2
    section: '2.4'
    title: Tìm kiếm và đánh giá thông tin học thuật
    chapter: Chương 2 – Khai thác dữ liệu và thông tin
    objective: 'Rèn kỹ năng tìm kiếm thông tin học thuật bằng các toán tử tìm kiếm nâng cao và đánh giá độ tin cậy của nguồn theo tiêu chí CRAAP. Chủ đề gắn với sở thích ca hát của mình: công nghệ số và AI trong dạy học thanh nhạc.'
    process:
      - 'Bước 1: Xác định câu hỏi nghiên cứu, từ khóa tiếng Việt và tiếng Anh, giới hạn thời gian (ưu tiên từ 2020).'
      - 'Bước 2: Thử 7 truy vấn kết hợp các toán tử " ", site:, filetype:, intitle:, dấu trừ và bộ lọc thời gian. Mỗi truy vấn đều chụp lại màn hình kết quả.'
      - 'Bước 3: Từ kết quả tốt, lần theo danh mục tài liệu tham khảo (snowballing) để tìm thêm nghiên cứu gốc.'
      - 'Bước 4: Mở và đọc từng nguồn, chấm 5 tiêu chí CRAAP (1–5 điểm), xếp vào ba nhóm: Dùng, Dùng có điều kiện, Loại.'
      - 'Bước 5: Rút ra bài học về cách dùng toán tử với tiếng Việt và tiếng Anh.'
      - 'Khó khăn: Google Scholar chặn truy vấn tự động. – Giải quyết bằng cách chuyển sang DuckDuckGo (hỗ trợ đúng site:, filetype: và ngoặc kép), không tìm cách vượt chặn.'
      - 'Khó khăn: Ghép quá nhiều điều kiện thì ra 0 kết quả, còn intitle: với tiếng Việt kéo theo quảng cáo. – Giải quyết bằng cách bắt đầu rộng rồi thu hẹp dần, và luôn đọc lại kết quả.'
    tool: 'DuckDuckGo (toán tử nâng cao), VJOL, MDPI, Wiley Online Library, arXiv; khung đánh giá CRAAP'
    ai_use: 'Không dùng AI để tìm hay đánh giá nguồn. Mọi nguồn đều được mở ra đọc trước khi chấm điểm.'
    product_file: bai2.yaml
  - id: 3
    section: '3.4'
    title: Viết Prompt hiệu quả cho các tác vụ học tập
    chapter: Chương 3 – Tổng quan về trí tuệ nhân tạo
    objective: Phát triển kỹ năng viết prompt hiệu quả để khai thác tốt mô hình ngôn ngữ lớn trong học tập. Mình chọn ba tác vụ gắn với chuyên ngành và sở thích ca hát của mình, viết cho mỗi tác vụ ba phiên bản prompt, chạy thử trên Gemini, rồi tự đối chiếu với tài liệu gốc và kiến thức nhạc lý. Mục đích là trả lời câu hỏi “vì sao prompt này tốt hơn prompt kia”, chứ không chỉ chứng minh rằng prompt dài thì tốt hơn.
    process:
      - 'Bước 1: Chọn 3 tác vụ theo đề và lấy nội dung từ chính ngành học: tóm tắt bài báo về ứng dụng CNTT trong dạy học âm nhạc của một giảng viên trường mình, giải thích khái niệm âm học “formant ca sĩ”, soạn đề ôn tập “Giọng trưởng và hóa biểu”. Với mỗi tác vụ, xác định trước thế nào là một câu trả lời tốt.'
      - 'Bước 2: Viết 9 prompt. Bản cơ bản chỉ có một câu. Bản cải tiến thêm người học, cấu trúc và độ dài. Bản nâng cao ở mỗi tác vụ dùng một tổ hợp kỹ thuật khác nhau: (1) đóng vai + suy luận từng bước + ràng buộc chỉ dùng tài liệu; (2) đóng vai + ví dụ mẫu + suy luận dẫn dắt + cá nhân hóa; (3) câu hỏi mẫu + ràng buộc phương án nhiễu + tự giải lại.'
      - 'Bước 3: Chạy cả 9 prompt trên Gemini (gemini.google.com, không đăng nhập) ngày 12/11/2026, mỗi prompt trong một cuộc trò chuyện mới. Riêng prompt nâng cao của tác vụ 1 có thêm lượt thứ hai: chép toàn văn bài báo từ file PDF rồi gửi tiếp (nối prompt). Chụp 27 ảnh màn hình.'
      - 'Bước 4: Chuẩn bị “đáp án” độc lập với AI: trích toàn văn bài báo từ VJOL; tra các nghiên cứu âm học giọng hát của Sundberg; tự giải lại 16 câu trắc nghiệm.'
      - 'Bước 5: Chấm mỗi phiên bản theo 5 tiêu chí (Chính xác, Đầy đủ, Hợp người học, Rõ ràng, Trung thực; thang 1–5), so sánh, phân tích nguyên nhân và rút ra 7 nguyên tắc.'
      - 'Khó khăn: Gemini trả lời rất tự tin dù không đọc được tài liệu, nên rất dễ tin ngay. – Giải quyết bằng cách tự tìm và đọc bản gốc trước khi chấm, và thêm vào prompt yêu cầu “không đọc được thì nói rõ”.'
      - 'Khó khăn: Kết quả không theo đúng dự đoán “nâng cao luôn thắng”: ở tác vụ 3, bản nâng cao lại kém bản cải tiến. – Giải quyết bằng cách chấm riêng từng tiêu chí và ghi lại kết quả đúng như đã xảy ra, rồi tìm nguyên nhân thay vì chỉnh lại cho đẹp.'
    tool: Gemini (gemini.google.com, không đăng nhập, chế độ Quick answers); bài báo trên Tạp chí Văn hóa Nghệ thuật (VJOL); các nghiên cứu âm học giọng hát của J. Sundberg
    ai_use: Gemini là đối tượng thử nghiệm của 9 prompt. Mọi nhận định về đúng/sai đều được đối chiếu với bài báo gốc, tài liệu âm học và lời giải nhạc lý.
    product_file: bai3.yaml
  - id: 4
    section: '4.4'
    title: Sử dụng công cụ hợp tác trực tuyến cho dự án nhóm
    chapter: Chương 4 – Giao tiếp và hợp tác trong môi trường số
    objective: 'Sử dụng công cụ trực tuyến để phối hợp trong dự án nhóm “Ứng dụng AI trong dạy học Âm nhạc ở tiểu học”. Trong buổi họp lập kế hoạch, mình nhận vai trò người điều phối: mở đầu, kiểm tra kết nối và giữ cho cuộc họp đi đúng mục tiêu.'
    process:
      - 'Bước 1: Nhóm thống nhất chủ đề, nền tảng họp (Google Meet) và mục tiêu cuộc họp qua nhóm chat.'
      - 'Bước 2: Phân công trước cuộc họp: Minh Anh điều phối và mở đầu; Phương Anh (70) trình bày ý tưởng; cả nhóm thảo luận nội dung và công cụ AI; Phương Anh (69) tổng kết nhiệm vụ.'
      - 'Bước 3: Họp trên Google Meet lúc 21:37 ngày 12/11/2026 với 4 thành viên. Mình ổn định, kiểm tra kết nối từng bạn và giới thiệu mục tiêu cuộc họp.'
      - 'Bước 4: Cả nhóm thảo luận nội dung và công cụ AI, sau đó tổng kết nhiệm vụ cho từng người.'
      - 'Khó khăn: Họp trực tuyến buổi tối, bốn người cùng nói dễ bị chồng tiếng. – Giải quyết bằng quy ước tắt micro khi chưa đến lượt và đi theo đúng thứ tự chương trình đã phân công.'
    tool: 'Google Meet (họp trực tuyến), nhóm chat (thống nhất chủ đề và phân công)'
    ai_use: 'Không sử dụng AI.'
    product_file: bai4.yaml
  - id: 5
    section: '5.4'
    title: Sử dụng AI tạo sinh để hỗ trợ sáng tạo nội dung
    chapter: Chương 5 – Sáng tạo nội dung số
    objective: 'Dùng AI tạo sinh làm “trợ lý ý tưởng” để tạo một học liệu số hoàn chỉnh: “Khởi động giọng cùng Đô Rê Mi”, 4 trò chơi khởi động giọng cho học sinh lớp 3. Mục tiêu không chỉ là có sản phẩm, mà còn là phát hiện được AI sai ở đâu và chứng minh phần đóng góp của chính mình.'
    process:
      - 'Bước 1: Xác định người học (lớp 3, 8–9 tuổi), thời lượng (5 phút đầu tiết) và trình tự khởi động chuẩn: thở → ngân → lên xuống cao độ → phát âm.'
      - 'Bước 2: Viết prompt có đóng vai, bối cảnh, định dạng 4 dòng cố định, ràng buộc độ dài câu vè, và yêu cầu AI tự ghi điều chưa chắc. Chạy trên Gemini ngày 13/11/2026.'
      - 'Bước 3: Đối chiếu từng dòng với kiến thức Thanh nhạc. Phát hiện 3 lỗi: gọi cộng hưởng là “vibrato”, không có âm tiết luyện phát âm, câu vè sai độ dài.'
      - 'Bước 4: Gửi lượt 2 chỉ ra lỗi. Gemini sửa nhưng lại thêm một khẳng định chưa có nguồn và cụm “Mê mha” không phải tiếng Việt.'
      - 'Bước 5: Tự viết lại phần lời (4 dòng luyện phát âm, câu vè 4 dòng), thống nhất tên nốt, rồi dựng học liệu tương tác có nút nghe thử từng trò chơi.'
      - 'Khó khăn: Lỗi của AI rất “hợp lý”, đọc lướt sẽ không thấy. – Giải quyết bằng cách lập bảng đối chiếu từng phần: AI đề xuất gì, giữ, sửa hay bỏ, và vì sao.'
    tool: 'Gemini (gemini.google.com, không đăng nhập, Quick answers); Web Audio để làm phần nghe thử'
    ai_use: 'Gemini tạo bản nháp 4 trò chơi (2 lượt hỏi, có ảnh chụp). Âm tiết luyện phát âm, câu vè và các sửa lỗi chuyên môn do mình tự làm.'
    product_file: bai5.yaml
  - id: 6
    section: '6.4'
    title: Sử dụng AI có trách nhiệm trong học tập và nghiên cứu
    chapter: Chương 6 – An toàn và liêm chính học thuật trong môi trường số
    objective: 'Xây dựng bộ nguyên tắc cá nhân về sử dụng AI có trách nhiệm trong học tập và nghiên cứu, dựa trên văn bản pháp luật hiện hành, khuyến nghị quốc tế và chính những lần mình gặp lỗi AI trong học phần này.'
    process:
      - 'Bước 1: Xem lại Bài 2, 3, 5 và ghi “nhật ký sự cố”: những lần AI bịa, sai chuyên môn, hoặc nguồn không đáng tin.'
      - 'Bước 2: Tìm đọc các căn cứ: Luật Trí tuệ nhân tạo 2025, Luật Bảo vệ dữ liệu cá nhân 2025, hướng dẫn của UNESCO (2023) về AI tạo sinh trong giáo dục, hướng dẫn trích dẫn AI của APA và quy định của học phần.'
      - 'Bước 3: Sắp xếp nguyên tắc theo 4 thời điểm của một lần dùng AI: trước khi hỏi, trong khi dùng, sau khi nhận, khi công bố. Mỗi nguyên tắc gắn với một minh chứng.'
      - 'Bước 4: Biến bộ nguyên tắc thành bảng tự kiểm tra 6 câu để dùng trước mỗi lần nộp bài.'
      - 'Khó khăn: Các nguyên tắc chung (minh bạch, trung thực…) rất dễ viết nhưng khó làm. – Giải quyết bằng cách viết mỗi nguyên tắc thành một hành động cụ thể và kèm lý do từ chính bài làm của mình.'
    tool: 'Văn bản pháp luật trên Thư viện Pháp luật; tài liệu UNESCO, APA Style'
    ai_use: 'Không dùng AI để viết nguyên tắc. Nội dung pháp lý được đối chiếu với văn bản gốc trên Thư viện Pháp luật.'
    product_file: bai6.yaml

conclusion:
  experience: 'Lúc mới bắt đầu học phần, mình nghĩ “công nghệ số” chỉ là học thêm vài phần mềm. Sau sáu bài, điều mình nhớ nhất là cảm giác bị AI thuyết phục: những câu trả lời trôi chảy, tự tin, nhưng có chỗ sai đúng vào chuyên ngành của mình. Học phần này dạy mình dùng công nghệ như một người làm nghề: biết sắp xếp, biết tìm, biết hỏi, và biết kiểm tra lại.'
  key_skills:
    - 'Tổ chức tệp và thư mục theo quy tắc đặt tên thống nhất, tách riêng việc học, luyện thanh và giáo án (Bài 1).'
    - 'Tìm kiếm học thuật bằng toán tử nâng cao và đánh giá nguồn theo CRAAP, phân biệt bài báo có bình duyệt với quảng cáo và bài “top 10” (Bài 2).'
    - 'Viết prompt có cấu trúc và chấm kết quả AI theo tiêu chí, thay vì tin ngay câu trả lời (Bài 3).'
    - 'Điều phối một cuộc họp trực tuyến theo chương trình đã phân công (Bài 4).'
    - 'Dùng AI tạo sinh làm trợ lý ý tưởng nhưng tự chịu trách nhiệm về nội dung chuyên môn (Bài 5).'
    - 'Xây dựng bộ nguyên tắc dùng AI có trách nhiệm, dựa trên luật hiện hành và minh chứng của chính mình (Bài 6).'
  highlight: 'Mình tâm đắc nhất với Bài 5, học liệu “Khởi động giọng cùng Đô Rê Mi”. Đó là lần đầu mình làm ra một thứ có thể mang vào lớp học thật, và cũng là lần mình thấy rõ nhất giá trị của kiến thức Thanh nhạc: chính nhờ hiểu cộng hưởng và vibrato khác nhau thế nào mà mình phát hiện được lỗi AI đưa ra.'
  challenge: 'Khó nhất là giữ được sự nghi ngờ đúng mức. AI viết rất hay nên mình dễ tin, nhưng nếu nghi ngờ mọi thứ thì không làm được việc. Mình vượt qua bằng cách đặt ra tiêu chí trước khi đọc câu trả lời, và chỉ giữ lại những gì kiểm chứng được bằng nguồn mình đã tự đọc.'
  future: 'Mình muốn phát triển “Khởi động giọng cùng Đô Rê Mi” thành một bộ học liệu cho cả năm học lớp 3, thử dạy trong đợt kiến tập, và tiếp tục cập nhật portfolio này sau mỗi học kỳ.'
  ai_note: 'Khai báo sử dụng AI: Gemini là đối tượng thử nghiệm ở Bài 3 và trợ lý ý tưởng ở Bài 5. Chi tiết từng bài nằm ở mục “Sử dụng AI” của bài đó. Mã nguồn website được xây dựng với sự hỗ trợ của trợ lý AI, xem README trong kho mã nguồn.'
