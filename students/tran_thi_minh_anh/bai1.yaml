lessons:
  - Delete chỉ đưa tệp vào Thùng rác nên còn khôi phục được. Shift + Delete xóa hẳn, nên phải đọc kỹ hộp thoại trước khi đồng ý.
  - Sao chép giữ lại bản gốc, còn di chuyển (Cut) thì tệp biến mất khỏi chỗ cũ.
  - Đặt tên không dấu, rõ nghĩa giúp tìm và chia sẻ tệp nhanh hơn. Gõ tên xong nên đọc lại một lần để tránh sai chính tả.
