kind: files
intro: 'Yêu cầu: trình bày cấu trúc thư mục tối ưu và quy tắc đặt tên tệp đã thiết lập, kèm ảnh chụp minh họa.'

problem: 'Một sinh viên Sư phạm Âm nhạc có rất nhiều loại tệp: bài tập nhiều môn, bản ghi âm luyện thanh, bản nhạc, giáo án và tài liệu tham khảo. Nếu để tất cả ở Desktop hay Downloads với những cái tên như “bai tap (1).docx” hoặc “ban cuoi that su.docx”, đến lúc cần nộp bài sẽ rất khó tìm và dễ nộp nhầm bản cũ. Vì vậy mình thiết lập lại toàn bộ cấu trúc thư mục ngay từ học kỳ này.'

# Bốn ý tưởng thiết kế
ideas:
  - k: '00 → 99'
    head: Đánh số thư mục
    body: Thư mục được đánh số 00, 01, 02… nên luôn hiện theo đúng thứ tự mình muốn, không bị xếp theo chữ cái. 00 là “hộp thư đến” để tạm mọi thứ mới tải về, 99 là kho lưu trữ đồ cũ.
  - k: 'Học kỳ'
    head: Chia theo học kỳ và học phần
    body: 'Mỗi học phần có một thư mục mang mã kỳ và tên môn, ví dụ “2026-HK1_INF2501_CongNgheSo-AI”. Hết kỳ, mình chỉ cần chuyển cả thư mục vào 99_LuuTru.'
  - k: 'Nghề'
    head: Tách riêng việc của nghề
    body: Luyện thanh (ghi chú, bản ghi âm theo tháng) và giáo án – học liệu cho học sinh được để riêng, không trộn với bài tập trên lớp, vì đó là những thứ mình sẽ dùng lâu dài sau khi ra trường.
  - k: '≤ 4'
    head: Không sâu quá 4 tầng
    body: Từ thư mục gốc tới một bài tập chỉ cần tối đa 4 lần mở thư mục. Sâu hơn thì rất khó tìm và đường dẫn sẽ quá dài.

