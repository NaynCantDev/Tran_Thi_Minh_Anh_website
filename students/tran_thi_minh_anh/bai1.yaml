# Quy tắc đặt tên: mẫu chung, tách thành từng phần
pattern:
  - {part: '2026-11-13', label: Ngày, rule: 'Viết theo dạng NĂM-THÁNG-NGÀY để tệp tự xếp đúng thứ tự thời gian'}
  - {part: 'INF2501', label: Mã học phần, rule: Biết ngay tệp thuộc môn nào}
  - {part: 'Bai1-CauTrucThuMuc', label: Nội dung, rule: 'Ngắn, không dấu, các từ nối bằng “-”'}
  - {part: 'v02', label: Phiên bản, rule: 'v01, v02… và không bao giờ dùng chữ “final”'}
rules:
  - Không dùng dấu tiếng Việt và khoảng trắng, vì một số phần mềm, web và điện thoại sẽ làm hỏng tên tệp.
  - Các phần lớn nối bằng gạch dưới “_”, các từ trong cùng một phần nối bằng gạch ngang “-”.
  - Ngày đứng đầu nên khi sắp xếp theo tên, tệp cũng xếp luôn theo thời gian.
  - Tài liệu tham khảo đặt theo Tác giả_Năm_Từ khóa để trích dẫn nhanh.
  - Ghi âm luyện thanh đặt theo Ngày_LuyenThanh_NoiDung để nghe lại theo đúng tiến trình.

