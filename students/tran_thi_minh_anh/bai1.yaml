# ============================================================
#  Bài 1.4 – Thao tác cơ bản với tệp tin và thư mục
#  Thực hành trong Windows Sandbox ngày 13/11/2026, ảnh: images/bai1/
# ============================================================
kind: files
intro: 'Yêu cầu: trình bày cấu trúc thư mục và quy tắc đặt tên tệp đã thiết lập, kèm ảnh chụp minh họa.'

result_tree:
  - {d: 1, depth: 0, name: Documents}
  - {d: 1, depth: 1, name: ThucHanh_TranThiMinhAnh}
  - {d: 1, depth: 2, name: TaiLieu, note: trống sau khi xóa hai tệp bên trong}
  - {depth: 2, name: GhiChuQuanTrong.txt}

rules:
  - Viết không dấu để tránh lỗi phông chữ và lỗi đường dẫn khi chia sẻ tệp.
  - Viết hoa chữ cái đầu mỗi từ, không dùng dấu cách (ví dụ GhiChuQuanTrong.txt).
  - Dùng dấu gạch dưới để tách tên bài và tên người làm (ThucHanh_TranThiMinhAnh).
  - Tên phải nói đúng nội dung bên trong tệp hoặc thư mục.

ops:
  - {op: Tạo thư mục mới, how: 'Chuột phải › New › Folder', key: 'Ctrl + Shift + N'}
  - {op: Tạo tệp văn bản, how: 'Chuột phải › New › Text Document', key: '—'}
  - {op: Đổi tên, how: 'Chuột phải › Rename', key: 'F2'}
  - {op: Sao chép, how: 'Copy › Paste', key: 'Ctrl + C › Ctrl + V'}
  - {op: Di chuyển, how: 'Cut › Paste', key: 'Ctrl + X › Ctrl + V'}
  - {op: Xóa vào Thùng rác, how: 'Chuột phải › Delete', key: 'Delete'}
  - {op: Xóa vĩnh viễn, how: 'Giữ Shift khi xóa', key: 'Shift + Delete'}
  - {op: Khôi phục, how: 'Recycle Bin › chuột phải › Restore', key: '—'}

