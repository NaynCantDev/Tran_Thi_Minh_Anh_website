# ============================================================
#  Bài 2.4 – Tìm kiếm và đánh giá thông tin học thuật
#  Tìm thật ngày 13/11/2026 trên DuckDuckGo (Google Scholar chặn
#  truy vấn tự động nên không dùng được), ảnh: images/bai2/
# ============================================================
kind: search
intro: 'Yêu cầu: trình bày kết quả tìm kiếm học thuật bằng các toán tử nâng cao và bảng đánh giá nguồn tin đã thực hiện.'

topic: Ứng dụng công nghệ số và AI trong dạy học thanh nhạc
question: Công nghệ số, đặc biệt là phản hồi hình ảnh theo thời gian thực và AI, đang được dùng thế nào trong dạy hát, và mang lại hiệu quả gì cho người học?
why: Ca hát là sở thích lớn nhất của mình, và mình muốn sau này đưa công nghệ vào giờ dạy hát. Chủ đề này nối thẳng hai điều đó lại với nhau.
keywords:
  vi: [thanh nhạc, dạy hát, đào tạo thanh nhạc, công nghệ số, kỷ nguyên số]
  en: [singing, voice pedagogy, real-time visual feedback, artificial intelligence, music education]
limits: Ưu tiên tài liệu từ 2020 trở lại đây. Riêng các công trình nền tảng về phản hồi hình ảnh trong dạy hát (2005, 2014) vẫn giữ lại vì được các nghiên cứu mới trích dẫn nhiều.

operators:
  - op: '" "'
    name: Ngoặc kép
    use: Tìm đúng nguyên cụm từ, không tách rời các từ
  - op: 'site:'
    name: Giới hạn trang
    use: Chỉ tìm trong một trang hoặc tên miền (ví dụ vjol.info.vn – kho tạp chí khoa học Việt Nam)
  - op: 'filetype:'
    name: Định dạng tệp
    use: Chỉ lấy tệp PDF, thường là toàn văn bài báo
  - op: 'intitle:'
    name: Trong tiêu đề
    use: Từ khóa phải nằm trong tiêu đề trang
  - op: '−'
    name: Loại trừ
    use: Bỏ các kết quả chứa từ không mong muốn (ví dụ karaoke)
  - op: 'Thời gian'
    name: Bộ lọc năm
    use: Chỉ hiện kết quả trong một năm gần đây (Past year)

queries:
  - n: 1
    q: '"thanh nhạc" site:vjol.info.vn'
    ops: ['" "', 'site:']
    result: Chỉ còn kết quả trên VJOL; ra 4 bài về thanh nhạc nhưng chủ yếu là lịch sử và dân ca, chưa đúng hướng công nghệ.
    verdict: Đúng nguồn, chưa đúng chủ đề
    shot: images/bai2/q1_site.jpg
  - n: 2
    q: '"thanh nhạc" "công nghệ" site:vjol.info.vn'
    ops: ['" "', 'site:']
    result: 0 kết quả. Ghép quá nhiều điều kiện chặt cùng lúc làm truy vấn hẹp tới mức không còn gì.
    verdict: Quá hẹp → nới bớt điều kiện
    shot: images/bai2/q2_zero.jpg
  - n: 3
    q: 'intitle:"thanh nhạc" "phần mềm"'
    ops: ['intitle:', '" "']
    result: 'Toàn quảng cáo “AI Music Generator” và bài giới thiệu phần mềm. Toán tử intitle: gần như bị bỏ qua với tiếng Việt có dấu.'
    verdict: Nhiễu → loại toàn bộ
    shot: images/bai2/q3_intitle_ads.jpg
  - n: 4
    q: '"đào tạo thanh nhạc" "xu hướng và thách thức"'
    ops: ['" "']
    result: 'Ra đúng bài của Hà Thị Lý và Nguyễn Thị Huyền (ĐHSP Nghệ thuật TW) trên Tạp chí Giáo dục & Xã hội, kèm bản PDF toàn văn.'
    verdict: Giữ – nguồn [1]
    shot: images/bai2/q4_phrase.jpg
  - n: 5
    q: '"giảng dạy thanh nhạc" "kỷ nguyên số" + lọc Past year'
    ops: ['" "', 'Thời gian']
    result: 'Hai kết quả: bài của Hoàng Quốc Tuấn (Tạp chí Khoa học ĐHSP Hà Nội 2) và bài của Nguyễn Thu Trang đăng trên website Trường CĐ Lạng Sơn.'
    verdict: Giữ – nguồn [2], [3]
    shot: images/bai2/q5_pastyear.jpg
  - n: 6
    q: '"singing" "real-time visual feedback" filetype:pdf'
    ops: ['" "', 'filetype:']
    result: 'Toàn bộ là PDF học thuật: bài tổng quan trên Applied Sciences (MDPI), dự án VOXed đăng trên Music Education Research, một bản preprint trên arXiv…'
    verdict: Giữ – nguồn [4], [5], [8]
    shot: images/bai2/q6_filetype.jpg
  - n: 7
    q: 'intitle:singing "artificial intelligence" "music education" -karaoke'
    ops: ['intitle:', '" "', '−']
    result: 'Ra bài tổng quan hệ thống về AI trong xướng âm – luyện tai (Wiley, 2026) và trang định hướng của NAfME. Tiêu đề không phải lúc nào cũng có chữ “singing”, tức intitle: chỉ được áp dụng lỏng.'
    verdict: Giữ – nguồn [7], [9]
    shot: images/bai2/q7_intitle_en.jpg
snowball: 'Ngoài tìm kiếm bằng toán tử, mình còn lần theo danh mục tài liệu tham khảo (snowballing) của các bài tổng quan và tìm ra nghiên cứu của Leong & Cheng (2014). Nghiên cứu này làm thực nghiệm với chính sinh viên sư phạm âm nhạc – nguồn [6].'

# Tiêu chí CRAAP, mỗi tiêu chí 1–5
craap:
  - k: C
    name: Cập nhật
    en: Currency
    d: Năm công bố, còn phù hợp với hiện tại không
  - k: R
    name: Liên quan
    en: Relevance
    d: Có trả lời đúng câu hỏi nghiên cứu không
  - k: A
    name: Uy tín
    en: Authority
    d: Tác giả, cơ quan, nơi đăng có bình duyệt không
  - k: A
    name: Chính xác
    en: Accuracy
    d: Có dữ liệu, phương pháp, trích dẫn để kiểm chứng không
  - k: P
    name: Mục đích
    en: Purpose
    d: Viết để nghiên cứu/giáo dục hay để quảng cáo, bán hàng
sources:
  - n: 1
    lang: vi
    type: Bài báo khoa học
    ref: 'Hà Thị Lý & Nguyễn Thị Huyền (2026). Ứng dụng công nghệ số trong đào tạo thanh nhạc: xu hướng và thách thức. *Tạp chí Giáo dục & Xã hội*, tháng 1/2026 (kì 2), tr. 50–55.'
    url: https://giaoducvaxahoi.vn/pic/Service/ha_thi_ly_nguyen_thi_huyen_pages_50_55_2070.pdf
    scores: [5, 5, 4, 4, 5]
    note: Tác giả ở chính trường mình (ĐHSP Nghệ thuật TW). Nghiên cứu định tính, kết hợp phân tích tài liệu và phỏng vấn sâu giảng viên, sinh viên thanh nhạc; 18 tài liệu tham khảo. Kết luận công nghệ chỉ có ý nghĩa khi củng cố năng lực nghệ thuật và tôn trọng bản sắc giọng hát.
