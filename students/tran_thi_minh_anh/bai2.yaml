verdicts: {keep: Dùng, cond: Dùng có điều kiện, drop: Loại}

lessons:
  - Google Scholar chặn truy vấn tự động. Khi một công cụ không dùng được, hãy đổi công cụ chứ không lách luật.
  - 'Ghép quá nhiều cụm trong ngoặc kép cùng với site: dễ ra 0 kết quả. Nên bắt đầu rộng rồi thu hẹp dần.'
  - 'intitle: hoạt động kém với tiếng Việt có dấu và chỉ được áp dụng lỏng, có thể kéo theo quảng cáo. Luôn đọc lại kết quả chứ đừng tin toán tử tuyệt đối.'
  - Cụm từ chính xác lấy từ tên một bài báo (“xu hướng và thách thức”) là cách nhanh nhất để tìm ra bản PDF toàn văn.
  - Nguồn tiếng Anh về dạy hát phong phú hơn hẳn. Kết hợp filetype:pdf với cụm chuyên ngành (“real-time visual feedback”) cho kết quả gần như toàn học thuật.
