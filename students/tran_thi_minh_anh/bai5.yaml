# --- 4 trò chơi đã chỉnh sửa (bản cuối) ---
games:
  - n: 1
    step: Thở
    name: Bóng bay căng phồng
    play: Cô làm mẫu hít vào bằng mũi thật êm, bụng phình ra như quả bóng, hai tay mở rộng thành vòng tròn. Thở ra từ từ bằng âm “sss…”, hai tay thu nhỏ dần như bóng xì hơi. Cả lớp làm 3 lần, lần sau thở ra lâu hơn lần trước.
    range: Không có cao độ, chỉ có hơi thở với âm “s”
    safe: Vai đứng yên, không nín thở, không cố thở ra đến hết sạch hơi.
    demo: breath
  - n: 2
    step: Ngân
    name: Chú ong chăm chỉ
    play: 'Cô ngân âm “m…” khép môi nhẹ như tiếng ong bay, rồi đi dần lên từng nốt Đô – Rê – Mi – Fa – Son. Học sinh đặt hai ngón tay lên cánh mũi để cảm nhận độ rung. Đó là âm thanh cộng hưởng (vang) ở vùng mặt, không phải vibrato.'
    range: Đô (C4) → Son (G4)
    safe: Ngân nhỏ (p–mf), không đẩy hơi mạnh, hàm và lưỡi thả lỏng.
    demo: hum
  - n: 3
    step: Lên xuống cao độ
    name: Thang máy vui vẻ
    play: 'Tay cô là chiếc thang máy. Tay đưa lên thì giọng trượt lên, tay hạ xuống thì giọng trượt xuống, cả lớp hát âm “vu…” theo tay. Bắt đầu bằng quãng ngắn Đô – Son, khi các em đã quen mới đi tới Đô cao.'
    range: Đô (C4) → Đô cao (C5)
    safe: Không với lên quá Đô cao, không hét ở đỉnh, mỗi lượt trượt khoảng 2–3 giây.
    demo: glide
  - n: 4
    step: Phát âm rõ lời
    name: Chiếc mũ kỳ diệu
    play: Cô đội “chiếc mũ kỳ diệu” rồi đọc mẫu một dòng. Cả lớp nhắc lại, mở rõ khẩu hình và bật rõ âm đầu. Mỗi dòng tập một phụ âm đầu, đọc theo nhịp hai nốt Fa – Son, lần sau nhanh hơn lần trước một chút.
    range: Fa (F4) – Son (G4)
    safe: Bật âm đầu bằng môi và lưỡi, không gằn cổ, không cắn chặt răng.
    demo: diction
    lines:
      - {c: B, t: 'Ba bế bé Bi'}
      - {c: L, t: 'Lá lúa lung linh'}
      - {c: M, t: 'Mẹ mua mũ mới'}
      - {c: C/K, t: 'Cô kể chuyện cổ'}

ve:
  title: Câu vè chuyển trò chơi
  note: 'Mỗi dòng 4 chữ và báo trước trò chơi tiếp theo, cả lớp vừa đọc vừa vỗ tay theo nhịp 2/4.'
  lines: ['Hít thật sâu nào', 'Ngân tiếng ong bay', 'Lên xuống thang mây', 'Đọc rõ từng lời']

# --- Quá trình làm việc với Gemini ---
prompt: |-
  Bạn là giáo viên Âm nhạc tiểu học có kinh nghiệm dạy hát cho học sinh lớp 3 (8–9 tuổi).
  Mình là sinh viên Sư phạm Âm nhạc, đang làm một học liệu số tên “Khởi động giọng cùng Đô Rê Mi” để dùng 5 phút đầu tiết hát.
  Hãy thiết kế 4 trò chơi khởi động ngắn, mỗi trò khoảng 1 phút, theo thứ tự: thở – ngân – lên xuống cao độ – phát âm rõ lời.
  Với mỗi trò chơi, ghi đúng 4 dòng:
  – Tên trò chơi (vui, dễ nhớ với trẻ em)
  – Cách chơi (2–3 câu, giáo viên làm mẫu thế nào, học sinh làm gì)
  – Âm vực sử dụng (ghi rõ từ nốt nào đến nốt nào)
  – Lưu ý an toàn cho giọng trẻ em
  Cuối cùng viết một câu vè 4 dòng, mỗi dòng 4–6 chữ, để cả lớp đọc theo nhịp khi chuyển giữa các trò chơi.
  Nếu có điểm nào bạn không chắc về sinh lý giọng trẻ em, hãy ghi rõ là chưa chắc.
techniques: [Đóng vai, Bối cảnh người học, Định dạng cố định 4 dòng, Ràng buộc độ dài, Yêu cầu tự báo điều chưa chắc]
followup: |-
  Cảm ơn bạn. Mình kiểm tra lại và thấy 3 chỗ cần sửa:
  1) Trò chơi 2: gõ ngón tay lên má khi ngân "m" có thật sự tạo ra vibrato không? Mình hiểu cảm giác rung ở mũi, má là do cộng hưởng (cộng minh), còn vibrato là dao động cao độ. Bạn kiểm tra lại giúp mình.
  2) Trò chơi 4: bạn chưa đưa ra âm tiết cụ thể nào. Hãy cho 4 cụm âm tiết ngắn cho học sinh lớp 3 đọc, mỗi cụm có phụ âm đầu khác nhau.
  3) Câu vè: mình yêu cầu mỗi dòng 4–6 chữ nhưng các dòng bạn viết chỉ có 3–4 chữ. Hãy viết lại cho đúng.
  Trả lời ngắn gọn theo 3 mục.

