kind: material
intro: 'Yêu cầu: trưng bày sản phẩm nội dung số hoàn thiện có sự hỗ trợ của AI tạo sinh. Sản phẩm của mình là một học liệu số dùng trong 5 phút đầu tiết hát lớp 3. Bạn có thể bấm nghe thử từng trò chơi ngay bên dưới.'

title: Khởi động giọng cùng Đô Rê Mi
audience: Học sinh lớp 3 (8–9 tuổi) · 5 phút đầu tiết hát
link_group: 'Học liệu này là phần cá nhân của mình trong đề tài nhóm “Ứng dụng AI trong dạy học Âm nhạc ở tiểu học: Biến mỗi giờ học thành một hành trình khám phá” (xem Bài 4).'

