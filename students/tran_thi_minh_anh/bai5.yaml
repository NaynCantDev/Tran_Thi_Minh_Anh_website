# --- Đối chiếu: AI đề xuất gì, mình giữ / sửa gì ---
edits:
  - part: Trò chơi 1 – Thở
    ai: Bong bóng bay căng phồng, thở ra bằng âm “s”, có nhắc thở bằng cơ hoành và không nhún vai.
    me: Giữ ý tưởng, rút tên còn “Bóng bay căng phồng” và thêm cách tăng dần độ dài hơi qua 3 lần.
    verdict: keep
  - part: Trò chơi 2 – Ngân
    ai: Gõ ngón tay lên má để “tạo độ rung (vibrato tự nhiên)”.
    me: 'Sai khái niệm. Vibrato là sự dao động nhẹ của cao độ, còn cảm giác rung ở mũi, má là cộng hưởng. Mình bỏ động tác gõ má, cho các em đặt tay lên cánh mũi để cảm nhận độ vang, và ghi rõ “không phải vibrato”.'
    verdict: fix
  - part: Lượt 2 – lời giải thích thêm
    ai: Khẳng định thanh đới trẻ lớp 3 “chưa phát triển đủ để tạo vibrato tự nhiên”.
    me: Đây là một khẳng định mới, mình chưa có tài liệu nào để kiểm chứng. Vì vậy mình không đưa vào học liệu.
    verdict: drop
  - part: Trò chơi 3 – Thang máy
    ai: Trượt âm “vu” từ C4 đến C5, có tự ghi là chưa chắc về độ ổn định ở quãng cao.
    me: Giữ, nhưng bắt đầu bằng quãng ngắn (Đô – Son) và giới hạn mỗi lượt trượt 2–3 giây, đúng với điều Gemini tự cảnh báo.
    verdict: keep
  - part: Trò chơi 4 – Phát âm
    ai: 'Lượt 1 không có âm tiết nào. Lượt 2 đưa “Mê mha, mi mhi”, “La la, li li”, “Ba ba, bi bi”, “Ca ca, ki ki”.'
    me: '“mha, mhi” không phải âm tiết tiếng Việt, còn các cụm khác chỉ là lặp âm nên không có nghĩa. Mình tự viết 4 dòng có nghĩa, mỗi dòng luyện một phụ âm đầu, ví dụ “Ba bế bé Bi”, “Mẹ mua mũ mới”.'
    verdict: fix
  - part: Câu vè
    ai: 'Lượt 1: “Nghe cô hô, / Vào vị trí…” (3–4 chữ, sai yêu cầu). Lượt 2: 5 chữ/dòng, đúng độ dài nhưng không gắn với trò chơi nào.'
    me: Mình tự viết câu vè 4 chữ/dòng, mỗi dòng báo trước một trò chơi, để vè vừa làm hiệu lệnh chuyển hoạt động vừa giúp các em nhớ thứ tự.
    verdict: fix
  - part: Tên nốt
    ai: Viết “Sol” và ký hiệu C4, G4…
    me: Thống nhất cách gọi tên nốt theo sách giáo khoa (Đô, Rê, Mi, Fa, Son, La, Si). Ký hiệu C4… chỉ để trong ngoặc, dành cho giáo viên.
    verdict: fix
verdicts: {keep: Giữ, fix: Tự sửa, drop: Bỏ}

ratio:
  - {who: Gemini, part: 'Khung 4 trò chơi, ý tưởng thở bằng âm “s”, trò thang máy, các lưu ý an toàn chung'}
  - {who: Mình, part: 'Phát hiện và sửa 3 lỗi nội dung, tự viết âm tiết luyện phát âm và câu vè, thống nhất tên nốt, thiết kế giao diện và phần nghe thử'}

lessons:
  - AI viết rất trôi chảy nên lỗi chuyên môn dễ bị bỏ qua. Lỗi “vibrato” nghe rất hợp lý, mình chỉ phát hiện được nhờ đã học Thanh nhạc.
  - Khi bị chỉ ra lỗi, AI sửa ngay nhưng có thể thêm một khẳng định mới chưa có nguồn. Vì vậy câu trả lời sau khi sửa cũng phải kiểm tra lại.
  - Với trẻ em, phần quan trọng nhất (lời đọc, câu vè) nên do giáo viên tự viết. AI phù hợp để gợi khung ý tưởng hơn là viết thay từng chữ.
